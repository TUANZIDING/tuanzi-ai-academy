# 团子 AI 课堂 · 手工教学元数据
# 星标、仓库一句话简介、语言、更新时间、是否开启 Pages：由 data/github-meta.json 在构建时合并。
# 这里写上课要用的分组、难度，以及“想法是怎样做成的”。
# 做法只根据 README 和提交记录。写不清的地方用「待补充」，不要编造。
# 新增公开仓库：补一条，然后 npm run refresh && npm run check。

site:
  name_zh: "团子 AI 课堂"
  name_en: "Tuanzi AI Academy"
  position_zh: "临床医生的 AI 实践课堂"
  position_en: "A practice classroom for clinicians using AI"
  headline_zh: "把自己的想法，做成一个能打开的东西"
  headline_en: "Turn an idea into something you can open"
  purpose_zh: "让人知道怎么样让自己的想法实现"
  purpose_en: "Show how to make your own idea real"
  slogan_zh: "先把念头说清楚，再拆开，和 AI 一起做成原型，然后发布出去。"
  slogan_en: "Say the idea, break it down, make a prototype with an AI tool, then publish it."
  person_zh: "丁海祥"
  person_en: "Haixiang Ding"
  role_zh: "创伤外科医生 · 苏州大学博士生"
  role_en: "Trauma surgeon · PhD student, Soochow University"
  about_role_zh: "创伤急救外科主治医师 · 苏州大学临床医学博士在读"
  about_role_en: "Emergency and trauma surgeon · PhD student in clinical medicine, Soochow University"
  about_zh: "我在急诊与创伤外科一线工作，临床经验涉及多发伤、骨盆骨折和老年髋部骨折。博士研究聚焦放射性骨骼肌损伤与修复。我希望把临床问题做成能看懂的教学内容、能复现的研究流程，以及来源可追溯的医学 AI 工具。"
  about_en: "I work in frontline emergency and trauma care, with clinical experience in polytrauma, pelvic fractures, and geriatric hip fractures. My doctoral research focuses on radiation-induced skeletal muscle injury and repair. I build open tools that connect clinical questions, medical education, reproducible research, and traceable evidence."
  principles_zh: "来源可追溯、证据边界明确、人工复核、保护患者隐私。"
  principles_en: "Traceable sources, explicit evidence limits, human review, and protection of patient privacy."
  research_zh: "肌肉干细胞、FAPs、免疫与基质相互作用、纤维化，以及细胞外囊泡相关研究方向；临床研究关注创伤结局、围术期低血压与肌肉骨骼健康。"
  research_en: "Muscle stem cells, fibro-adipogenic progenitors, immune–stromal interactions, fibrosis, and extracellular vesicles as a research direction. Clinical research looks at trauma outcomes, perioperative hypotension, and musculoskeletal health."
  hospital_zh: "江南大学附属医院"
  hospital_en: "Affiliated Hospital of Jiangnan University"
  places_zh: "无锡 / 苏州"
  places_en: "Wuxi / Suzhou, China"
  email: "haixiangding001@gmail.com"
  github: "https://github.com/TUANZIDING"
  website: "https://tuanziding.github.io/"
  linkedin: "https://www.linkedin.com/in/haixiang-ding-a1a646411/"

modules:
  - id: a
    code: "A"
    title_zh: "创伤与医学教育互动课堂"
    title_en: "Trauma and medical-education classrooms"
    summary_zh: "临床教学里的一个想法，做成能投屏的一页。看的时候先问：原来想讲清什么，现在打开的又是什么。"
    summary_en: "A teaching idea turned into a page you can project. Ask what it set out to explain, and what the page actually opens."
  - id: b
    code: "B"
    title_zh: "医学科研与可复现研究"
    title_en: "Medical research and reproducible studies"
    summary_zh: "一个研究问题怎样拆成可复现的步骤：方法、代码、人工核对。推不推广，以各仓库自己写下的边界为准。"
    summary_en: "How a research question becomes repeatable steps: method, code, and a person checking. Each repo states how far the result may go."
  - id: c
    code: "C"
    title_zh: "Codex / Agent 工作流与技能"
    title_en: "Codex and agent workflows"
    summary_zh: "和 Codex、Claude Code 或其他代理一起干活时，交接、确认和停止条件怎样写成能再走一遍的步骤。"
    summary_en: "When you work with Codex, Claude Code, or another agent, how the handoff, the check, and the stop are written so someone can walk them again."
  - id: d
    code: "D"
    title_zh: "亲子与创意 AI"
    title_en: "Family and creative AI"
    summary_zh: "一句话、一本书或一座只有台基的宫殿，怎样变成能打开的页面。适合先看成品，再回头做自己的小块。"
    summary_en: "A sentence, a book, or a palace that was never built upstairs, turned into a page you can open. Look at the finished piece, then make your own small piece."
  - id: e
    code: "E"
    title_zh: "开源实验室"
    title_en: "Open-source lab"
    summary_zh: "别人已经做成的工具。用来看一种做法，不是把上游的制作过程说成我们自己的。没有记录的地方标待补充。"
    summary_en: "Tools other people already made. Use them to see one way of working. Where the making was not recorded, it stays marked as not yet written down."
  - id: site
    code: "S"
    title_zh: "主页与本站"
    title_en: "Profile and this site"
    summary_zh: "学术主页、GitHub 简介仓库，以及你正在看的这间课堂。"
    summary_en: "The academic homepage, the GitHub profile repository, and this classroom."

levels:
  - id: L0
    title_zh: "先看一个做成的样子"
    title_en: "See one finished piece"
    summary_zh: "先打开别人已经发布的页面，看想法最后长什么样。不要求会写代码。"
    summary_en: "Open a page someone already published and see what the idea became. No coding yet."
  - id: L1
    title_zh: "把想法拆开"
    title_en: "Break the idea down"
    summary_zh: "写成今天能做完的一块：一页、一个例子、一句要人确认的话。"
    summary_en: "Cut it into one piece you can finish today: a page, an example, or a sentence a person must confirm."
  - id: L2
    title_zh: "做出打得开的原型"
    title_en: "Make a prototype you can open"
    summary_zh: "和 Codex、Claude Code 或其他代理一起做。在浏览器或自己的电脑里打得开，才算做成。"
    summary_en: "Make it with Codex, Claude Code, or another agent. It counts when you can open it in a browser or on your own computer."
  - id: L3
    title_zh: "把做法写成能再走一遍"
    title_en: "Write the steps so they can be walked again"
    summary_zh: "数据从哪来、哪里必须停、谁来确认，都留在记录里。"
    summary_en: "Write down where the data came from, where the work must stop, and who confirms it."
  - id: L4
    title_zh: "收成可以交给下一个人的技能"
    title_en: "Leave a skill the next person can use"
    summary_zh: "把流程收成技能或代理。失败时停下来，不编一句看起来完整的话。"
    summary_en: "Package the workflow as a skill or agent. When a step fails, stop, instead of adding a sentence that only sounds finished."

journey:
  - n: "1"
    title_zh: "说出想法"
    title_en: "Say the idea"
    summary_zh: "用一句话说清要做什么、给谁用、做成什么样算完成。还没写清的，就标待补充。"
    summary_en: "Say what you are making, who it is for, and what done looks like. If that is not clear yet, mark it as still to be added."
    examples: ["nianjing", "storysprout", "comic-companion-course"]
  - n: "2"
    title_zh: "拆开"
    title_en: "Break it down"
    summary_zh: "不要一次做完。先切出今天能做完的一块，并写明哪一句不能让工具替你说死。"
    summary_en: "Do not build the whole thing at once. Cut out one piece for today, and write down what the tool must not decide for you."
    examples: ["clinical-stats-languages-guide", "research-evidence", "comic-companion-course"]
  - n: "3"
    title_zh: "和 AI 一起做"
    title_en: "Work with an AI tool"
    summary_zh: "Codex、Claude Code 或其他代理都可以。先写它能改什么、不能碰什么，做完由人看一遍。"
    summary_en: "Codex, Claude Code, or another agent can help. First write what it may change and what it must not touch. A person looks before anything is shared."
    examples: ["codex-hark-bridge", "codex-obsidian-wechat-workflow", "medical-paper-pipeline"]
  - n: "4"
    title_zh: "做出原型"
    title_en: "Make a prototype"
    summary_zh: "在自己的电脑或浏览器里打开。打不开，就不算做成。"
    summary_en: "Open it on your own computer or in a browser. If it does not open, it is not made yet."
    examples: ["epang-palace", "peter-rabbit-interactive", "trauma-master-academy"]
  - n: "5"
    title_zh: "发布并分享"
    title_en: "Publish and share"
    summary_zh: "放上 GitHub。静态页可以用 GitHub Pages，让别人不用安装就能打开。说明里写下想法、工具，和还待补充的地方。"
    summary_en: "Put it on GitHub. A static page can go out through GitHub Pages so someone else can open it without installing anything. Write the idea, the tools, and what is still missing."
    examples: ["epang-palace", "comic-companion-course", "orthopaedic-trauma-atlas"]

projects:
  - repo: trauma-master-academy
    kind: original
    module: a
    level: L2
    status: live
    projectable: true
    title_zh: "创伤救治学院"
    title_en: "Trauma Master Academy"
    summary_zh: "中英文创伤救治教学平台，把院前预警、团队、xABCDE、病种推理、操作模拟、转运和复评连成一条学习链。"
    summary_en: "A bilingual trauma-care platform linking pre-alert, teamwork, xABCDE, system reasoning, procedural simulation, transfer, and reassessment."
    idea_zh: "把院前预警到复评的创伤救治链，做成中英文能打开的教学平台。"
    idea_en: "Turn the trauma pathway, from pre-alert to reassessment, into a bilingual site people can open."
    steps_zh: "README 写的是平台本身和教学边界。提交记录里有一次合并，分支名为 codex/homepage-trauma-care-chain。哪几步由 AI 写成，README 没有写，待补充。页面发布在 GitHub Pages。"
    steps_en: "The README describes the platform and its teaching limits. One merged branch is named codex/homepage-trauma-care-chain. Which steps an AI wrote is not in the README. To be added. The page is on GitHub Pages."
    reproduce_zh: "打开在线页，沿院前、团队、xABCDE、转运和复评走一遍，并记住它写明只用于教学。"
    reproduce_en: "Open the live page and walk pre-alert, the team, xABCDE, transfer, and reassessment. Keep the README limit: teaching only."
    topics: ["创伤", "xABCDE", "教学", "双语"]
    audience_zh: "医学生、实习医师、住培医师和青年临床医师"
    audience_en: "Medical students, interns, residents, and early-career clinicians"
    hours_zh: "门户可投屏浏览 1 课时；骨科 12 单元按单元另开"
    hours_en: "One session to tour the portal; the 12 orthopaedic units need their own sessions"
    boundary_zh: "README 写明仅用于教学，不是床旁决策支持、医疗器械、医院规程或个体化治疗方案。骨科单元为教学试用，待教师复核。"
    boundary_en: "The README limits this to education. It is not bedside decision support, a device, a hospital protocol, or a personal treatment plan. The orthopaedic units are a teaching pilot pending teacher review."

