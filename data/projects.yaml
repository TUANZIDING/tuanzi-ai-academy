    idea_en: "A long agent run can quietly swap the whole goal for a local one. This tool writes the root goal and the approved decisions as a baseline, then checks each stretch."
    steps_zh: "README 给了不安装第三方库的命令。基线是不是某个 AI 起草的，待补充。示例已脱敏。"
    steps_en: "The README gives a command with no third-party libraries. Whether an AI drafted the baseline is not recorded. To be added. The example is de-identified."
    reproduce_zh: "跑仓库里的脱敏示例，读一份报告。不要把分数当成临床结论。"
    reproduce_en: "Run the de-identified example and read one report. Do not treat the score as a clinical conclusion."
    topics: ["审计", "多轮", "Agent", "本地"]
    audience_zh: "已经在用多轮代理做项目、担心做着做着换了题的人"
    audience_en: "People running multi-turn agents who worry the task quietly changes"
    hours_zh: "建议 1 课时跑仓库里的脱敏示例，读一份监测报告"
    hours_en: "One session to run the de-identified example and read one report"
    boundary_zh: "示例已脱敏，不含未公开权利要求、精确制造参数或临床阈值。监测分数不是医学或法律结论。"
    boundary_en: "The example is de-identified. It has no unpublished claims, exact manufacturing parameters, or clinical thresholds. A drift score is not a medical or legal conclusion."

