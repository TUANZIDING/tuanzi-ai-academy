    local_en: "Open dist/index.html locally, as the README says. The public demo URL in the README does not open right now, so this site does not link it."
    boundary_zh: "病例、生命体征和动画都是合成教学情境。不是 ATLS 官方认证课程，不能替代专业培训、本院流程或个体化诊疗。"
    boundary_en: "Cases, vital signs, and animations are synthetic. This is not an official ATLS course and does not replace training, local protocol, or care of a real patient."

