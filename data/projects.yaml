    idea_en: "Medical slides often bake words into pictures, or delete a qualifier to look cleaner. This skill keeps the words editable."
    steps_zh: "README 写明它是 Codex 技能，克隆到 ~/.codex/skills/ 后用 $medical-conference-pptx 调用。"
    steps_en: "The README says it is a Codex skill. Clone it into ~/.codex/skills/ and call $medical-conference-pptx."
    reproduce_zh: "用自带的六页模板看一页：标题、数字和引用是否还能改。"
    reproduce_en: "Use the included six-slide template and check one slide: can you still edit the title, the numbers, and the citation?"
    topics: ["PPT", "会议", "可编辑", "技能"]
    audience_zh: "做医学会议、继续教育和学术汇报幻灯片的人"
    audience_en: "People making slides for medical meetings, continuing education, and research talks"
    hours_zh: "建议 1 课时用自带的 6 页起始模板讲“哪些字必须还能编辑”"
    hours_en: "One session with the included 6-slide starter, focused on what must stay editable"
    boundary_zh: "不要为了版面删掉医学限定条件，也不要把探索性机制写成临床结论。仓库是 source-available：非商业免费，商业使用需要授权。"
    boundary_en: "Do not delete a medical qualifier to save space, or turn an exploratory mechanism into a clinical conclusion. The repo is source-available: free for non-commercial use, with a separate commercial license."

  - repo: topic-drift-guard
    kind: original
    module: c
    level: L3
    status: pilot
    projectable: false
    title_zh: "主题漂移监测"
    title_en: "Topic Drift Guard"
