  - repo: orthopaedic-trauma-atlas
    kind: original
    module: a
    level: L2
    status: live
    projectable: true
    title_zh: "骨科创伤操作教学图谱"
    title_en: "Orthopaedic Trauma Atlas"
    summary_zh: "给医学教师的中英双语图谱。路径是识别解剖、选择入路、看神经血管风险，再复核来源和限制。含筋膜室切开和牵引、外固定等页面。"
    summary_en: "A bilingual atlas for medical teachers: anatomy, approach, neurovascular risk, then sources and limits. Includes fasciotomy, traction, and external fixation pages."
    idea_zh: "给医学教师一条路径：先认解剖，再选入路，看神经血管风险，然后核对来源。"
    idea_en: "A path for medical teachers: anatomy, approach, neurovascular risk, then the sources."
    steps_zh: "README 写明首页有 AI 生成的导览图，具体模型和提示词待补充。医学内容来自各模块的教学图和公开来源。站点用 GitHub Pages 发布。"
    steps_en: "The README says the homepage has AI-generated guide images. The model and prompts are not named. To be added. The medical figures come from each module and public sources. The site is on GitHub Pages."
    reproduce_zh: "投屏打开一个部位。先分开哪张是导览、哪张是教学图，再读页面上的限制。"
    reproduce_en: "Project one region. Separate the guide image from the teaching figure, then read the limits on the page."
    topics: ["骨科创伤", "解剖", "神经血管", "教学图"]
    audience_zh: "医学教师，以及需要看入路和风险分层的学员"
    audience_en: "Medical teachers and learners who need approach and risk layers"
    hours_zh: "建议 1 课时讲一个部位（例如小腿筋膜室或胫骨结节牵引）"
    hours_en: "One session for a single region, such as the leg compartments or tibial traction"
    boundary_zh: "教学图配有来源链接和使用限制。不能代替标本、手术带教或本院操作规范。"
    boundary_en: "Teaching images come with source links and limits. They do not replace specimens, supervised operating, or local protocol."

  - repo: radiation-muscle-pathway
    kind: original
    module: a
    level: L3
    status: live
    projectable: true
    title_zh: "辐射肌肉损伤与修复图谱"
    title_en: "Radiation muscle pathway"
    summary_zh: "中文优先、可切英文的交互图谱，按六个阶段演示电离辐射后的肌肉干细胞损伤、FAP、免疫基质通讯、成肌障碍和修复窗口，并给证据分级。"
    summary_en: "A Chinese-first, English-switchable atlas of six stages after ionizing radiation: MuSC injury, FAPs, immune–stromal signals, failed myogenesis, and a repair window, with evidence grades."
    idea_zh: "把电离辐射后的肌肉损伤和修复按阶段讲清，并标出证据等级。"
    idea_en: "Explain radiation muscle injury and repair in stages, with evidence grades kept visible."
    steps_zh: "README 写数据在 pathway-data.js，播放在 timeline.js，Pages 入口是 docs/index.html。用哪个 AI 工具协助写成，待补充。"
    steps_en: "The README puts the data in pathway-data.js, playback in timeline.js, and the Pages entry at docs/index.html. Which AI tool helped write it is not recorded. To be added."
    reproduce_zh: "打开 Pages，按证据等级筛选着讲。不要顺着动画下治疗结论。"
    reproduce_en: "Open the Pages site and teach from the evidence grades. Do not turn the animation into treatment advice."
    topics: ["辐射", "肌肉", "证据分级", "教学图谱"]
    audience_zh: "想把这条研究讲清楚的研究生和教师"
    audience_en: "Graduate students and teachers explaining this research line"
    hours_zh: "页面动画总长约 34 秒，只表示教学顺序。建议 1 课时顺着证据等级讲，而不是顺着动画下结论"
    hours_en: "The animation is about 34 seconds and only marks teaching order. Use one session to follow evidence grades, not the motion."
    boundary_zh: "A/B/C 级线型表示证据强弱。动画不改变证据等级。页面不把动物药理或摘要级候选写成治疗建议。"
    boundary_en: "Line styles mark evidence grades. Animation does not change them. Animal pharmacology and abstract-level candidates are not treatment advice."

